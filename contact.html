<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Hamid Raza Bajwa</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%23FAFAFA'/><text x='32' y='42' font-family='IBM Plex Sans, sans-serif' font-weight='700' font-size='26' fill='%23B45309' text-anchor='middle'>HB</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --text: #1A1A1A;
    --bg: #FAFAFA;
    --accent: #B45309;
    --accent-tint: #FBEFD9;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    max-width: 480px;
    width: 100%;
  }
  h1 {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 700;
    font-size: clamp(24px, 5vw, 32px);
    line-height: 1.15;
    margin: 0 0 12px 0;
    letter-spacing: -0.01em;
  }
  p.lede {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    line-height: 1.6;
    color: #5a5a5a;
    margin: 0 0 28px 0;
  }
  label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    margin: 0 0 6px 0;
    color: var(--text);
  }
  input, textarea {
    width: 100%;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    color: var(--text);
    background: #fff;
    border: 1px solid #d8d2c6;
    border-radius: 2px;
    padding: 12px 14px;
    margin-bottom: 18px;
    resize: vertical;
    min-height: 44px;
    box-sizing: border-box;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 16px;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 2px;
    padding: 14px 22px;
    min-height: 44px;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  .back {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    margin-top: 24px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    text-decoration: none;
  }
  .back:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>Get in touch</h1>
  <p class="lede">Open the notebook, ask a question, or just say hi.</p>

  <!-- Formspree setup: replace YOUR_FORM_ID below after creating a free
       form at https://formspree.io -->
  <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="5" required></textarea>

    <input type="hidden" name="_redirect" value="thanks.html">
    <input type="text" name="_gotcha" style="display:none">

    <button type="submit">Send message</button>
  </form>

  <a class="back" href="index.html">&larr; Back to home</a>
</main>
  <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "b373efd298a740e4bb913c0eee9fa5c3"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
